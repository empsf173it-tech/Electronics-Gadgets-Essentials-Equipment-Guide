</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">⚡ GadgetNet</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link " href="index.html">Home</a></li>
<li class="nav-item"><a class="nav-link " href="resources.html">Resources</a></li>

      </div>
    </nav>
    
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4">
                    <div class="text-center mb-4">
                        <img src="https://picsum.photos/100/100?random=9" class="rounded-circle mb-2" alt="User Icon">
                        <h2>Member Sign In</h2>
                    </div>
                    <form onsubmit="event.preventDefault(); alert('Logged in successfully!');">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" required placeholder="engineer@gadgetnet.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                    <div class="mt-3 text-center">
                        <small>Don't have an account? <a href="register.html">Register here</a></small>
                    </div>
                </div>
            </div>
        </div>
